<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scope 1, 2 and 3 emissions trend</title>
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%;
      background: #f9fafb;
      font-family: Arial, "Segoe UI", sans-serif;
      color: #1f2937;
      display: flex; align-items: center; justify-content: center;
    }
    #card {
      max-width: 680px;
      width: 100%;
      padding: 40px 48px;
      text-align: left;
      box-sizing: border-box;
    }
    .kicker {
      font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: #F4633A; margin: 0 0 10px 0;
    }
    .intro {
      font-size: clamp(1.1rem, 2.4vw, 1.4rem); font-weight: 700; color: #111827;
      margin: 0 0 22px 0; line-height: 1.35;
    }
    .trend-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .trend-card {
      background: #fff;
      border-radius: 14px;
      padding: 18px 20px 14px;
      box-shadow: 0 2px 10px rgba(17,24,39,0.08);
      opacity: 0;
      transform: translateY(10px);
      animation: cardIn 0.5s ease forwards;
    }
    .trend-card.scope3 { animation-delay: 0.1s; }
    .trend-card.scope12 { animation-delay: 0.35s; }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

    .trend-label {
      font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      color: #6b7280; margin: 0 0 6px 0;
    }
    .trend-value-row { display: flex; align-items: baseline; gap: 6px; }
    .trend-value {
      font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 800; line-height: 1;
    }
    .trend-card.scope3 .trend-value { color: #F4633A; }
    .trend-card.scope12 .trend-value { color: #6b7280; }
    .trend-arrow { font-size: 1.3rem; font-weight: 800; }
    .trend-card.scope3 .trend-arrow { color: #F4633A; }
    .trend-card.scope12 .trend-arrow { color: #9ca3af; }
    .trend-caption { font-size: 13px; color: #6b7280; margin: 4px 0 10px 0; }

    .sparkline { display: block; width: 100%; height: 52px; }
    .spark-path {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      animation: draw 1.1s ease forwards;
    }
    .trend-card.scope3 .spark-path { stroke: #F4633A; animation-delay: 0.5s; }
    .trend-card.scope12 .spark-path { stroke: #9ca3af; animation-delay: 0.75s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .spark-area { opacity: 0; animation: areaIn 0.6s ease forwards; }
    .trend-card.scope3 .spark-area { animation-delay: 1.3s; }
    .trend-card.scope12 .spark-area { animation-delay: 1.55s; }
    @keyframes areaIn { to { opacity: 1; } }
    .spark-dot {
      opacity: 0;
      animation: dotIn 0.4s ease forwards;
    }
    .trend-card.scope3 .spark-dot { animation-delay: 1.5s; }
    .trend-card.scope12 .spark-dot { animation-delay: 1.75s; }
    @keyframes dotIn { to { opacity: 1; } }
    .spark-years {
      display: flex; justify-content: space-between;
      font-size: 11px; color: #9ca3af; margin-top: 2px;
    }
  </style>
</head>
<body>
  <div id="card">
    <p class="kicker">Scope 1, 2 &amp; 3 trend</p>
    <p class="intro">Between 2021-22 and 2024-25&hellip;</p>

    <div class="trend-grid">
      <div class="trend-card scope3">
        <p class="trend-label">Scope 3</p>
        <div class="trend-value-row">
          <span class="trend-arrow">&#8599;</span>
          <span class="trend-value">+29%</span>
        </div>
        <p class="trend-caption">reported emissions rose</p>
        <svg class="sparkline" viewBox="0 0 120 52" preserveAspectRatio="none">
          <path class="spark-area" d="M2,44 C30,42 55,34 78,22 100,12 108,8 118,5 L118,50 2,50 Z" fill="#F4633A" fill-opacity="0.12" stroke="none" />
          <path class="spark-path" d="M2,44 C30,42 55,34 78,22 100,12 108,8 118,5" />
          <circle class="spark-dot" cx="118" cy="5" r="4" fill="#F4633A" />
        </svg>
        <div class="spark-years"><span>2021-22</span><span>2024-25</span></div>
      </div>

      <div class="trend-card scope12">
        <p class="trend-label">Scope 1 &amp; 2</p>
        <div class="trend-value-row">
          <span class="trend-arrow">&#8600;</span>
          <span class="trend-value">&minus;1%</span>
        </div>
        <p class="trend-caption">reported emissions barely changed</p>
        <svg class="sparkline" viewBox="0 0 120 52" preserveAspectRatio="none">
          <path class="spark-area" d="M2,24 C30,23 55,25 78,24 100,25 108,25 118,26 L118,50 2,50 Z" fill="#9ca3af" fill-opacity="0.12" stroke="none" />
          <path class="spark-path" d="M2,24 C30,23 55,25 78,24 100,25 108,25 118,26" />
          <circle class="spark-dot" cx="118" cy="26" r="4" fill="#9ca3af" />
        </svg>
        <div class="spark-years"><span>2021-22</span><span>2024-25</span></div>
      </div>
    </div>
  </div>

  <script>
    window.parent?.postMessage({ type: 'DIVE_READY', source: 'scope-trend-facts' }, '*');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeroing in?</title>
  <script src="dive-lang.js"></script>
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #16222b;
      font-family: Arial, "Segoe UI", sans-serif;
    }
    #stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6em;
      text-align: center;
      background:
        radial-gradient(circle at 82% 12%, rgba(244,99,58,0.38), transparent 48%),
        radial-gradient(circle at 12% 88%, rgba(13,148,136,0.30), transparent 46%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.04), transparent 60%),
        linear-gradient(160deg, #16222b 0%, #1c1d1e 55%, #23150f 100%);
      background-size: 160% 160%;
      animation: gradientDrift 5s ease-in-out infinite alternate;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0;
      animation: rise 3.6s ease-in forwards;
    }
    .orb:nth-child(1) { left: 18%; bottom: 8%;  width: 14px; height: 14px; background: rgba(244,99,58,0.75); animation-delay: 0.15s; }
    .orb:nth-child(2) { left: 74%; bottom: 14%; width: 10px; height: 10px; background: rgba(13,148,136,0.7);  animation-delay: 0.35s; }
    .orb:nth-child(3) { left: 42%; bottom: 4%;  width: 8px;  height: 8px;  background: rgba(255,255,255,0.55); animation-delay: 0.5s; }
    .orb:nth-child(4) { left: 87%; bottom: 40%; width: 12px; height: 12px; background: rgba(244,99,58,0.5);  animation-delay: 0.25s; }
    .orb:nth-child(5) { left: 6%;  bottom: 46%; width: 9px;  height: 9px;  background: rgba(13,148,136,0.55); animation-delay: 0.6s; }
    .kicker {
      font-size: clamp(0.85rem, 1.6vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #F4633A;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.45s ease 0.05s forwards;
    }
    .title {
      font-size: clamp(3rem, 9vw, 7rem);
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.01em;
      opacity: 0;
      transform: translateY(16px) scale(0.96);
      animation: fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.18s forwards;
    }
    .title .dot { color: #F4633A; }
    .bar {
      width: 72px; height: 4px; border-radius: 2px;
      background: #F4633A;
      transform: scaleX(0);
      transform-origin: center;
      animation: growBar 0.4s ease 0.55s forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes growBar {
      to { transform: scaleX(1); }
    }
    @keyframes gradientDrift {
      to { background-position: 30% 20%; }
    }
    @keyframes rise {
      0% { opacity: 0; transform: translateY(0); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-60px); }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="kicker" data-i18n="titleCardKicker">Audit Wales &bull; Net Zero 2025</div>
    <div class="title"><span data-i18n="titleCardTitle">Zeroing in</span><span class="dot">?</span></div>
    <div class="bar"></div>
  </div>
</body>
</html>

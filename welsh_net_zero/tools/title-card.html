<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeroing in?</title>
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #1c1d1e;
      font-family: Arial, "Segoe UI", sans-serif;
    }
    #stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6em;
      text-align: center;
      background:
        radial-gradient(circle at 82% 12%, rgba(244,99,58,0.14), transparent 45%),
        radial-gradient(circle at 10% 88%, rgba(244,99,58,0.08), transparent 40%),
        #1c1d1e;
    }
    .kicker {
      font-size: clamp(0.85rem, 1.6vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #F4633A;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.45s ease 0.05s forwards;
    }
    .title {
      font-size: clamp(3rem, 9vw, 7rem);
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.01em;
      opacity: 0;
      transform: translateY(16px) scale(0.96);
      animation: fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.18s forwards;
    }
    .title .dot { color: #F4633A; }
    .bar {
      width: 72px; height: 4px; border-radius: 2px;
      background: #F4633A;
      transform: scaleX(0);
      transform-origin: center;
      animation: growBar 0.4s ease 0.55s forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes growBar {
      to { transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="kicker">Audit Wales &bull; Net Zero 2025</div>
    <div class="title">Zeroing in<span class="dot">?</span></div>
    <div class="bar"></div>
  </div>
</body>
</html>

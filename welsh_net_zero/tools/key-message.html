<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Key message</title>
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #ffffff;
      font-family: Arial, "Segoe UI", sans-serif;
    }
    #stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9em;
      text-align: center;
      padding: 0 10%;
      background:
        radial-gradient(circle at 92% 8%, rgba(244,99,58,0.07), transparent 40%),
        radial-gradient(circle at 6% 94%, rgba(244,99,58,0.05), transparent 38%),
        #ffffff;
    }
    .kicker {
      font-size: clamp(0.75rem, 1.3vw, 0.95rem);
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #9ca3af;
      opacity: 0;
      animation: fadeInOut 4.8s ease 0.1s both;
    }
    .headline {
      font-size: clamp(2rem, 5.5vw, 4.5rem);
      font-weight: 800;
      color: #1f2937;
      line-height: 1.15;
      max-width: 16em;
      opacity: 0;
      animation: fadeInOut 4.8s ease 0.2s both;
    }
    .headline .hl {
      position: relative;
      color: #F4633A;
      cursor: pointer;
      border-bottom: 3px solid rgba(244,99,58,0.3);
      transition: border-color 0.2s ease;
    }
    .headline .hl:hover { border-color: #F4633A; }
    .hl-tip {
      position: absolute; left: 50%; top: 100%;
      transform: translate(-50%, 4px);
      background: #111827; color: #f9fafb;
      font-size: 0.9rem; font-weight: 400;
      padding: 8px 14px; border-radius: 8px;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .headline .hl:hover .hl-tip { opacity: 1; transform: translate(-50%, 10px); }
    .bar {
      width: 64px; height: 4px; border-radius: 2px;
      background: #F4633A;
      opacity: 0;
      animation: barReveal 4.8s ease 0.2s both;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(14px); }
      15% { opacity: 1; transform: translateY(0); }
      82% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes barReveal {
      0% { opacity: 0; transform: scaleX(0); }
      15% { opacity: 1; transform: scaleX(0); }
      35% { transform: scaleX(1); }
      82% { opacity: 1; transform: scaleX(1); }
      100% { opacity: 0; transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="kicker">Audit Wales</div>
    <div class="headline">Wales is unlikely to achieve <span class="hl">the 2030 ambition<span class="hl-tip">Confirmed by our 2026 review</span></span></div>
    <div class="bar"></div>
  </div>
</body>
</html>

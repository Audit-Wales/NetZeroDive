<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reporting bodies growth</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="dive-lang.js"></script>
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #f9fafb;
      font-family: Arial, "Segoe UI", sans-serif;
      color: #1f2937;
    }
    body { animation: pageFadeOut 0.8s ease 7.2s forwards; }
    body.explore-open { animation-play-state: paused; }
    #chart { width: 100%; height: 100%; position: relative; }
    .title    { font-size: 20px; font-weight: 600; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6b7280; font-family: Arial, sans-serif; }
    .axis text { fill: #6b7280; font-size: 13px; }
    .axis path, .axis line { stroke: #d1d5db; }
    .grid line { stroke: #e5e7eb; stroke-dasharray: 3 4; }
    .grid path { stroke: none; }
    .line-path { fill: none; stroke: #F4633A; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px rgba(244,99,58,0.45)); }
    .area-path { fill: url(#area-gradient); }
    .pen-icon { font-size: 22px; }

    .overlay-top {
      position: absolute;
      left: 50%; top: 6%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: min(94%, 960px);
    }
    .overlay-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      width: 100%;
    }
    .overlay-narrative {
      flex: 1 1 auto;
      align-self: center;
      text-align: left;
      opacity: 0;
      transform: translateY(-14px);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    .overlay-narrative.visible { opacity: 1; transform: translateY(0); }
    .overlay-text {
      font-size: clamp(1.5rem, 3.2vw, 2.15rem);
      font-weight: 600;
      line-height: 1.35;
      color: #374151;
      margin: 0;
      text-shadow: 0 0 14px #f9fafb, 0 0 6px #f9fafb;
    }
    .overlay-text strong { color: #111827; font-weight: 800; }
    .overlay-delta {
      flex: none;
      text-align: center;
      opacity: 0;
      transform: translateY(-14px);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    .overlay-delta.visible { opacity: 1; transform: translateY(0); }
    .delta-inline {
      display: flex; align-items: baseline; justify-content: center; gap: 8px;
    }
    .delta-num {
      font-size: clamp(2.8rem, 6.5vw, 5rem);
      font-weight: 800;
      color: #F4633A;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 14px #f9fafb, 0 0 6px #f9fafb;
    }
    .delta-label {
      font-size: clamp(0.85rem, 1.4vw, 1.05rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9ca3af;
      text-shadow: 0 0 14px #f9fafb, 0 0 6px #f9fafb;
    }
    @keyframes pageFadeOut {
      to { opacity: 0; }
    }

    /* ── Explore breakdown button ── */
    .explore-hint {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9ca3af;
      text-align: center;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.5s ease, transform 0.3s ease;
    }
    .explore-hint.visible { opacity: 1; transform: translateY(0); }
    #explore-btn {
      background: #F4633A;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 13px 26px;
      font-size: 16px;
      font-weight: 700;
      font-family: Arial, "Segoe UI", sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(244,99,58,0.35);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: opacity 0.5s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1), background 0.2s ease;
      z-index: 15;
    }
    #explore-btn.visible {
      opacity: 1; pointer-events: auto; transform: translateY(0);
      animation: exploreBtnPulse 1.7s ease-in-out 0.6s 3;
    }
    #explore-btn:hover { background: #e0522e; transform: scale(1.05); }
    #explore-btn:active { transform: scale(0.97); }
    #explore-btn .arrow { display: inline-block; animation: exploreArrowNudge 1.7s ease-in-out 0.6s 3; }
    @keyframes exploreBtnPulse {
      0%, 100% { box-shadow: 0 4px 16px rgba(244,99,58,0.35), 0 0 0 0 rgba(244,99,58,0.45); }
      50% { box-shadow: 0 4px 16px rgba(244,99,58,0.35), 0 0 0 14px rgba(244,99,58,0); }
    }
    @keyframes exploreArrowNudge {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(3px, -3px); }
    }

    /* ── Breakdown pop-out modal ── */
    #breakdown-modal {
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #breakdown-modal.open { opacity: 1; pointer-events: auto; }
    #breakdown-modal-inner {
      position: relative;
      width: min(92vw, 1100px);
      height: min(88vh, 680px);
      background: #f9fafb;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      transform: scale(0.94);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    #breakdown-modal.open #breakdown-modal-inner { transform: scale(1); }
    #breakdown-modal iframe { width: 100%; height: 100%; border: none; display: block; }
    #breakdown-modal-close {
      position: absolute;
      top: 10px; right: 12px;
      width: 32px; height: 32px;
      background: rgba(17,24,39,0.55);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s ease;
      z-index: 10;
    }
    #breakdown-modal-close:hover { background: rgba(17,24,39,0.85); }
  </style>
</head>
<body>
  <div id="chart"></div>
  <div class="overlay-top">
    <div class="overlay-row">
      <div class="overlay-narrative" id="overlay-narrative">
        <p class="overlay-text" data-i18n-html="bodiesGrowthOverlay">Reporting bodies have increased from <strong>69 to 82</strong> between 2021-22 and 2024-25.</p>
      </div>
      <div class="overlay-delta" id="overlay-delta">
        <div class="delta-inline">
          <span class="delta-num" id="delta-num">1</span>
          <span class="delta-label" data-i18n="bodiesGrowthDeltaLabel">more bodies</span>
        </div>
      </div>
    </div>
    <div class="explore-hint" id="explore-hint" data-i18n="exploreBtnHint">Pause video to explore</div>
    <button id="explore-btn" aria-label="See who they are">
      <span data-i18n="bodiesGrowthExploreBtn">See who they are</span> <span class="arrow" aria-hidden="true">&#8599;</span>
    </button>
  </div>

  <div id="breakdown-modal" role="dialog" aria-modal="true" aria-label="Reporting bodies by organisation type">
    <div id="breakdown-modal-inner">
      <button id="breakdown-modal-close" aria-label="Close">&times;</button>
      <iframe id="breakdown-iframe" src="" title="Reporting bodies by organisation type"></iframe>
    </div>
  </div>

  <script>
    window.__diveReadyManual = true;
    const root = d3.select('#chart');
    const margin = { top: 88, right: 48, bottom: 56, left: 64 };
    let svg, xScale, yScale, lineG, areaG, penG;
    let chartData = null;
    let currentTimelineTimeMs = 0;
    let segmentStartTimeMs = 0;
    let overlayShown = false;
    let lastNarrativeState = null;
    let lastNarrativeTimeMs = 0;
    let fallbackBootstrapStarted = false;
    const DRAW_DURATION_MS = 3000;
    const DELTA_TARGET = 13;
    const DEFAULT_DATA_URL = new URL('../data/welsh-net-zero.json', window.location.href).toString();

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function fyLabel(year) { return (year - 1) + '-' + String(year).slice(-2); }
    function standaloneDataUrl() {
      const p = new URLSearchParams(window.location.search);
      const v = p.get('data') || p.get('dataUrl');
      return v ? new URL(v, window.location.href).toString() : DEFAULT_DATA_URL;
    }

    async function bootstrapStandalone() {
      if (chartData || fallbackBootstrapStarted) return;
      fallbackBootstrapStarted = true;
      try {
        const res = await fetch(standaloneDataUrl());
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        if (chartData) return;
        initialize(data);
        if (lastNarrativeState) applyState(lastNarrativeState, lastNarrativeTimeMs);
        else { render(1); showOverlay(); }
      } catch (e) {
        console.error('Reporting-bodies-growth bootstrap failed', e);
        root.append('div').style('position', 'absolute').style('inset', '0')
          .style('display', 'grid').style('place-items', 'center')
          .style('font-size', '14px').style('color', '#374151').text('Unable to load data.');
        window.parent?.postMessage({ type: 'DIVE_READY', source: 'reporting-bodies-growth' }, '*');
      }
    }

    function setupChart() {
      root.selectAll('svg').remove();
      const W = root.node().clientWidth || 960;
      const H = root.node().clientHeight || 540;
      const iW = W - margin.left - margin.right;
      const iH = H - margin.top - margin.bottom;
      const data = chartData.emissionsPerBody;

      svg = root.append('svg').attr('width', W).attr('height', H)
        .attr('viewBox', `0 0 ${W} ${H}`).attr('preserveAspectRatio', 'xMidYMid meet');

      const defs = svg.append('defs');
      const grad = defs.append('linearGradient').attr('id', 'area-gradient')
        .attr('gradientUnits', 'userSpaceOnUse').attr('x1', 0).attr('y1', margin.top).attr('x2', 0).attr('y2', margin.top + iH);
      grad.append('stop').attr('offset', '0%').attr('stop-color', '#F4633A').attr('stop-opacity', 0.18);
      grad.append('stop').attr('offset', '100%').attr('stop-color', '#F4633A').attr('stop-opacity', 0.01);

      const years = data.map(d => d.year);
      xScale = d3.scalePoint().domain(years).range([0, iW]).padding(0.3);
      yScale = d3.scaleLinear().domain([0, 90]).range([iH, 0]);

      const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

      g.append('g').attr('class', 'grid')
        .call(d3.axisLeft(yScale).ticks(6).tickSize(-iW).tickFormat(() => ''));
      g.append('g').attr('class', 'axis').attr('transform', `translate(0,${iH})`)
        .call(d3.axisBottom(xScale).tickFormat(fyLabel));
      g.append('g').attr('class', 'axis')
        .call(d3.axisLeft(yScale).ticks(6).tickFormat(d3.format('d')));

      areaG = g.append('g');
      lineG = g.append('g');

      penG = svg.append('g');
      penG.append('text').attr('class', 'pen-icon').attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'auto').attr('opacity', 0).text('\u270f\ufe0f');

      svg.append('text').attr('class', 'subtitle').attr('x', margin.left).attr('y', margin.top - 30)
        .text(diveT('bodiesGrowthSubtitle'));
      svg.append('text').attr('class', 'title').attr('x', margin.left).attr('y', margin.top - 10)
        .text(diveT('bodiesGrowthTitle'));
    }

    function render(progress) {
      if (!chartData || !svg) return;
      const data = chartData.emissionsPerBody;
      const lineGen = d3.line().x(d => xScale(d.year)).y(d => yScale(d.bodies)).curve(d3.curveMonotoneX);

      const areaGen = d3.area().x(d => xScale(d.year)).y0(yScale(0)).y1(d => yScale(d.bodies)).curve(d3.curveMonotoneX);
      areaG.selectAll('path.area-path').data([data]).join('path')
        .attr('class', 'area-path').attr('d', areaGen);

      const fullPath = lineG.selectAll('path.line-path').data([data]).join('path')
        .attr('class', 'line-path').attr('d', lineGen);
      const totalLen = fullPath.node().getTotalLength();
      fullPath.attr('stroke-dasharray', totalLen).attr('stroke-dashoffset', (1 - progress) * totalLen);

      const penIcon = penG.select('text.pen-icon');
      if (progress > 0.01 && progress < 0.999) {
        const point = fullPath.node().getPointAtLength(progress * totalLen);
        penIcon.attr('x', margin.left + point.x + 2).attr('y', margin.top + point.y - 8).attr('opacity', 1);
      } else {
        penIcon.attr('opacity', 0);
      }
    }

    function animateNum(el, from, target, duration) {
      const start = performance.now();
      const tick = (now) => {
        const t = Math.min(1, (now - start) / duration);
        const ease = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(from + (target - from) * ease);
        if (t < 1) requestAnimationFrame(tick);
        else el.textContent = target;
      };
      requestAnimationFrame(tick);
    }

    function showOverlay() {
      if (overlayShown) return;
      overlayShown = true;
      document.getElementById('overlay-narrative').classList.add('visible');
      document.getElementById('overlay-delta').classList.add('visible');
      animateNum(document.getElementById('delta-num'), 1, DELTA_TARGET, 1200);
      document.getElementById('explore-hint').classList.add('visible');
      document.getElementById('explore-btn').classList.add('visible');
    }

    function applyState(state, timeMs) {
      if (!chartData) return;
      if (typeof timeMs === 'number' && isFinite(timeMs)) currentTimelineTimeMs = timeMs;
      if (state.streamTime) {
        segmentStartTimeMs = Number(state.segmentStartTimeMs) || 0;
        const elapsed = currentTimelineTimeMs - segmentStartTimeMs;
        const progress = clamp(elapsed / DRAW_DURATION_MS, 0, 1);
        render(progress);
        if (elapsed >= DRAW_DURATION_MS) showOverlay();
      } else {
        render(1);
        showOverlay();
      }
    }

    function initialize(data) {
      if (!data || !data.emissionsPerBody) return;
      chartData = data;
      setupChart();
      render(0);
      window.parent?.postMessage({ type: 'DIVE_READY', source: 'reporting-bodies-growth' }, '*');
    }

    window.addEventListener('dive-lang', () => {
      if (!chartData) return;
      svg.select('text.subtitle').text(diveT('bodiesGrowthSubtitle'));
      svg.select('text.title').text(diveT('bodiesGrowthTitle'));
    });
    window.addEventListener('resize', () => { if (!chartData) return; setupChart(); render(overlayShown ? 1 : 0); });

    const exploreBtn = document.getElementById('explore-btn');
    const breakdownModal = document.getElementById('breakdown-modal');
    const breakdownIframe = document.getElementById('breakdown-iframe');
    const BREAKDOWN_URL = new URL('reporting-bodies-breakdown.html', window.location.href).toString();

    // Wall-clock pageFadeOut must stay paused whenever playback is paused, not just while the modal is open,
    // otherwise dwelling here (the whole point of pauseOnInteract) can fade the tool out from under the user.
    let isPlaying = false;
    function updateFadePause() {
      document.body.classList.toggle('explore-open', !isPlaying || breakdownModal.classList.contains('open'));
    }
    updateFadePause();

    function openBreakdownModal() {
      window.parent?.postMessage({ type: 'DIVE_INTERACT', source: 'reporting-bodies-growth' }, '*');
      if (!breakdownIframe.getAttribute('src')) breakdownIframe.src = BREAKDOWN_URL;
      breakdownModal.classList.add('open');
      updateFadePause();
    }
    function closeBreakdownModal() {
      breakdownModal.classList.remove('open');
      updateFadePause();
    }

    exploreBtn.addEventListener('click', openBreakdownModal);
    document.getElementById('breakdown-modal-close').addEventListener('click', closeBreakdownModal);
    breakdownModal.addEventListener('click', (e) => { if (e.target === breakdownModal) closeBreakdownModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBreakdownModal(); });

    window.addEventListener('message', event => {
      const p = event.data;
      if (!p || !p.type) return;
      if (p.type === 'DIVE_INIT') { initialize(p.data); }
      else if (p.type === 'DIVE_STATE') {
        lastNarrativeState = p.state || {};
        lastNarrativeTimeMs = (typeof p.time === 'number' && isFinite(p.time)) ? p.time : currentTimelineTimeMs;
        if (!chartData) { bootstrapStandalone(); return; }
        applyState(lastNarrativeState, lastNarrativeTimeMs);
      } else if (p.type === 'DIVE_PLAYBACK') {
        isPlaying = !!p.isPlaying;
        if (isPlaying) closeBreakdownModal();
        updateFadePause();
      }
    });
    window.setTimeout(() => { if (!chartData) bootstrapStandalone(); }, 180);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance and skills barriers</title>
  <script src="dive-lang.js"></script>
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #ffffff;
      font-family: Arial, "Segoe UI", sans-serif;
      color: #1f2937;
    }
    body { animation: pageFadeOut 0.8s ease 14.2s forwards; }

    #stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      gap: clamp(28px, 5vw, 72px);
      text-align: center;
      padding: 4% 6%;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 92% 8%, rgba(244,99,58,0.07), transparent 40%),
        radial-gradient(circle at 6% 94%, rgba(120,53,15,0.06), transparent 38%),
        #ffffff;
    }

    .narrative-panel {
      flex: 0 0 auto;
      width: clamp(240px, 36%, 460px);
      display: flex; flex-direction: column; align-items: flex-start;
      text-align: left;
    }

    .bars-panel {
      flex: 0 0 auto;
      display: flex; flex-direction: column; align-items: center;
    }

    .kicker {
      font-size: clamp(0.95rem, 1.7vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #9ca3af;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.1s forwards;
    }
    .headline {
      font-size: clamp(2.4rem, 5.2vw, 4.1rem);
      font-weight: 800;
      color: #1f2937;
      line-height: 1.15;
      max-width: 12em;
      margin: 0.3em 0 0 0;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.3s forwards;
    }

    .bars {
      --bar-h: clamp(200px, 34vh, 340px);
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 280px));
      grid-template-rows: auto var(--bar-h) auto;
      column-gap: clamp(40px, 8vw, 100px);
      justify-content: center;
      margin-top: clamp(10px, 2vh, 22px);
    }
    .col-1 { grid-column: 1; }
    .col-2 { grid-column: 2; }

    .bar-value {
      grid-row: 1;
      align-self: end;
      font-size: clamp(1.6rem, 3.4vw, 2.5rem);
      font-weight: 800;
      margin-bottom: 10px;
      opacity: 0; transform: scale(0.4);
      animation: popValue 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    .bar-value.cost { color: #F4633A; }
    .bar-value.funding { color: #515254; }

    /* Shared reference frame: same grid row/height as both tracks, so the
       comparison line lines up precisely regardless of label wrapping. */
    .compare-frame {
      grid-row: 2;
      grid-column: 1 / -1;
      position: relative;
    }
    .compare-line {
      position: absolute;
      left: -14px; right: -14px;
      bottom: 8%;
      border-top: 4px dashed #78350f;
      opacity: 0;
      z-index: 2;
      animation: fadeUp 0.5s ease forwards;
    }
    .compare-line-label {
      position: absolute;
      right: -14px;
      bottom: calc(8% + 10px);
      font-size: clamp(0.9rem, 1.4vw, 1.1rem);
      font-weight: 700;
      color: #78350f;
      background: #fff8f2;
      border: 1px solid #78350f;
      padding: 3px 10px;
      border-radius: 5px;
      white-space: nowrap;
      opacity: 0;
      z-index: 2;
      animation: fadeUp 0.5s ease forwards;
    }

    .bar-track {
      grid-row: 2;
      width: clamp(80px, 8.5vw, 120px);
      height: 100%;
      justify-self: center;
      background: #f3f4f6;
      border-radius: 8px 8px 3px 3px;
      display: flex; align-items: flex-end;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    .bar-fill {
      width: 100%;
      height: 100%;
      border-radius: 6px 6px 0 0;
      transform: scaleY(0);
      transform-origin: bottom;
      animation: growBar 0.9s cubic-bezier(.22,1.68,.36,1) forwards;
    }
    .bar-fill.cost { background: linear-gradient(180deg, #F4633A, #d94f28); --target-scale: 1; }
    .bar-fill.funding { background: linear-gradient(180deg, #9aa1a8, #6b7280); --target-scale: 0.08; }

    .bar-label {
      grid-row: 3;
      margin-top: 14px;
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      font-weight: 600;
      color: #374151;
      line-height: 1.4;
      max-width: 100%;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }

    .gap-callout {
      margin: clamp(14px, 3vh, 28px) 0 0 0;
      font-size: clamp(1.45rem, 2.9vw, 2.1rem);
      font-weight: 700;
      color: #111827;
      opacity: 0;
      animation: popValue 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    .gap-callout .hl { color: #F4633A; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popValue {
      0%   { opacity: 0; transform: scale(0.4); }
      60%  { opacity: 1; transform: scale(1.15); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes growBar {
      from { transform: scaleY(0); }
      to   { transform: scaleY(var(--target-scale)); }
    }
    @keyframes pageFadeOut { to { opacity: 0; } }
  </style>
</head>
<body>
  <div id="stage">
    <div class="narrative-panel">
      <p class="kicker" data-i18n="financeKicker">Finance & Skills</p>
      <h1 class="headline" data-i18n="financeHeadline">Finance and skills remain major barriers</h1>
    </div>

    <div class="bars-panel">
      <div class="bars">
        <div class="compare-frame">
          <div class="compare-line" style="animation-delay:6.6s"></div>
          <div class="compare-line-label" style="animation-delay:6.8s" data-i18n="financeFundingLineLabel">&pound;228m funding level</div>
        </div>

        <div class="bar-value cost col-1" style="animation-delay:1.8s">&pound;2.8bn</div>
        <div class="bar-value funding col-2" style="animation-delay:6.3s">&pound;228m</div>

        <div class="bar-track cost col-1">
          <div class="bar-fill cost" style="animation-delay:1.5s"></div>
        </div>
        <div class="bar-track funding col-2">
          <div class="bar-fill funding" style="animation-delay:6.0s"></div>
        </div>

        <p class="bar-label col-1" style="animation-delay:2.2s" data-i18n="financeCostLabel">
          Estimated cost to decarbonise Welsh council buildings alone
        </p>
        <p class="bar-label col-2" style="animation-delay:6.7s" data-i18n="financeFundingLabel">
          Funding to support public bodies&rsquo; decarbonisation since our last report (2022&ndash;23 to 2025&ndash;26)
        </p>
      </div>

      <p class="gap-callout" style="animation-delay:10.5s">
        <span data-i18n="financeGapPre">That&rsquo;s over</span>
        <span class="hl" data-i18n="financeGapHighlight">12&times;</span>
        <span data-i18n="financeGapSuffix">the funding actually provided.</span>
      </p>
    </div>
  </div>
</body>
</html>

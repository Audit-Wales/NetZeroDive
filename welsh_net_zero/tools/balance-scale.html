<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balance of pressures</title>
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #f9fafb;
      font-family: Arial, "Segoe UI", sans-serif;
      color: #1f2937;
    }
    body { animation: pageFadeOut 0.8s ease 6.2s forwards; }
    #stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
    }
    .kicker {
      font-size: clamp(0.85rem, 1.6vw, 1.05rem);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #9ca3af;
      opacity: 0;
      animation: fadeIn 0.5s ease 0.1s forwards;
    }
    .scale-wrap {
      position: relative;
      width: min(88%, 780px);
      height: 300px;
    }
    .fulcrum {
      position: absolute; left: 50%; bottom: 0;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 26px solid transparent;
      border-right: 26px solid transparent;
      border-bottom: 42px solid #374151;
    }
    .post {
      position: absolute; left: 50%; bottom: 42px;
      width: 6px; height: 90px;
      background: #9ca3af;
      transform: translateX(-50%);
    }
    .beam {
      position: absolute; left: 8%; right: 8%; bottom: 132px;
      height: 8px; border-radius: 4px;
      background: linear-gradient(#6b7280, #4b5563);
      transform-origin: 50% 50%;
      opacity: 0;
      animation: fadeIn 0.4s ease 0.3s forwards, tiltBeam 1.6s cubic-bezier(0.4,0,0.2,1) 2.1s forwards;
    }
    .pan {
      position: absolute; top: 100%;
      display: flex; flex-direction: column; align-items: center;
      transform-origin: top center;
    }
    .pan::before {
      content: "";
      display: block;
      width: 2px; height: 38px;
      background: #9ca3af;
    }
    .pan-left  { left: 0;  animation: counterTiltLeft  1.6s cubic-bezier(0.4,0,0.2,1) 2.1s forwards; transform: translateX(-50%); }
    .pan-right { right: 0; animation: counterTiltRight 1.6s cubic-bezier(0.4,0,0.2,1) 2.1s forwards; transform: translateX(50%); }

    .chip {
      margin-top: 8px;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(17,24,39,0.08);
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      animation: chipIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    .chip.positive { background: #ffffff; border: 1.5px solid #cbd5e1; color: #374151; }
    .chip.pressure { background: #fff6f3; border: 1.5px solid #F4633A; color: #9a3412; }
    .chip .icon { margin-right: 5px; }
    .chip.positive .icon { color: #6b7280; }
    .chip.pressure .icon { color: #F4633A; }

    .pan-left  .chip:nth-child(1) { animation-delay: 0.4s; }
    .pan-left  .chip:nth-child(2) { animation-delay: 0.8s; }
    .pan-left  .chip:nth-child(3) { animation-delay: 1.2s; }
    .pan-right .chip:nth-child(1) { animation-delay: 0.6s; }
    .pan-right .chip:nth-child(2) { animation-delay: 1.0s; }
    .pan-right .chip:nth-child(3) { animation-delay: 1.4s; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes chipIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes tiltBeam {
      to { transform: rotate(7deg); }
    }
    @keyframes counterTiltLeft {
      to { transform: translateX(-50%) rotate(-7deg); }
    }
    @keyframes counterTiltRight {
      to { transform: translateX(50%) rotate(-7deg); }
    }
    @keyframes pageFadeOut {
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="kicker">Progress vs. pressure</div>
    <div class="scale-wrap">
      <div class="beam">
        <div class="pan pan-left">
          <div class="chip positive"><span class="icon">&#10003;</span>Better understanding</div>
          <div class="chip positive"><span class="icon">&#10003;</span>More reporting</div>
          <div class="chip positive"><span class="icon">&#10003;</span>More plans</div>
        </div>
        <div class="pan pan-right">
          <div class="chip pressure"><span class="icon">&#9888;</span>Financial pressures</div>
          <div class="chip pressure"><span class="icon">&#9888;</span>Political pressures</div>
          <div class="chip pressure"><span class="icon">&#9888;</span>Reticence about delivery</div>
        </div>
      </div>
      <div class="post"></div>
      <div class="fulcrum"></div>
    </div>
  </div>
</body>
</html>
